name: Extract ZIP & Build APK

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cari & ekstrak ZIP
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then echo "Tidak ada file .zip di root repo"; exit 1; fi
          echo "Mengekstrak $ZIP"
          rm -rf _x && mkdir _x && unzip -q "$ZIP" -d _x
          # kalau isi zip dibungkus 1 folder, masuk ke folder itu
          SRC=_x
          if [ ! -f _x/package.json ] && [ "$(ls -A _x | wc -l)" = "1" ] && [ -d "_x/$(ls _x)" ]; then
            SRC="_x/$(ls _x)"
          fi
          # salin ke root repo (folder .github tidak ditimpa)
          rsync -a --exclude='.github' --exclude='__MACOSX' "$SRC"/ ./
          rm -rf _x

      - name: Commit hasil ekstrak
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Extract ZIP [skip ci]" && git push)

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Build APK
        run: |
          npm install
          [ -d android ] || npx cap add android
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: alchemy-tactics-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
