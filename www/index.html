<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Alchemy Tactics</title>
<style>
html,body{margin:0;height:100%;background:#14121f;color:#eee;font-family:sans-serif;overflow:hidden;touch-action:manipulation}
#top{height:52px;padding-top:env(safe-area-inset-top,0);display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;padding-left:8px;padding-right:8px}
#bar{height:60px;padding-bottom:env(safe-area-inset-bottom,0);display:flex;gap:8px;justify-content:center;align-items:center}
button{font-size:16px;padding:10px 16px;border:0;border-radius:8px;background:#5b4bd6;color:#fff}
button.r{background:#c0392b}button.g{background:#444}
canvas{display:block;margin:0 auto}
</style></head><body>
<div id="top"></div><canvas id="c"></canvas><div id="bar"></div>
<script>
const C=8,R=9,D=[[0,-1],[1,0],[0,1],[-1,0]];
const Hh=[];for(let y=0;y<R;y++){Hh[y]=[];for(let x=0;x<C;x++)Hh[y][x]=(y<=1||y>=7)?0:Math.max(0,Math.min(3,Math.round(1+1.3*Math.sin(x*1.7+y*1.1))));}
const mk=(n,l,team,x,y,hp,atk,mov,rng,jump)=>({n,l,team,x,y,hp,mhp:hp,atk,mov,rng,jump,f:team?2:0,done:false,mp:24,mmp:24,skillCd:0,skillMax:2});
let units,sel,phase,tiles,turn,over,msg;
function init(){units=[mk('Ksatria','K',0,3,8,60,18,3,1,1),mk('Pemanah','P',0,5,8,40,14,3,4,2),mk('Penyihir','S',0,4,7,35,20,3,2,1),
mk('Prajurit','p',1,1,0,45,13,3,1,1),mk('Prajurit','p',1,5,0,45,13,3,1,1),mk('Dukun','d',1,3,1,32,15,3,3,1)];
sel=null;phase='idle';tiles=[];turn=1;over=false;say('Giliran 1 — pilih unit biru');ui();}
const top_=document.getElementById('top'),bar=document.getElementById('bar'),cv=document.getElementById('c'),g=cv.getContext('2d');
let T=40;
function say(m){msg=m;top_.textContent=m;}
function resize(){const aw=innerWidth,ah=innerHeight-52-60-(parseInt(getComputedStyle(top_).paddingTop)||0);T=Math.floor(Math.min(aw/C,ah/R));cv.width=T*C;cv.height=T*R;draw();}
addEventListener('resize',resize);
const at=(x,y)=>units.find(u=>u.hp>0&&u.x==x&&u.y==y);
const dirTo=(a,b)=>{const dx=b.x-a.x,dy=b.y-a.y;return Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0);};
function reach(u){const seen={[u.x+','+u.y]:1},q=[[u.x,u.y,0]],out=[[u.x,u.y]];
while(q.length){const [x,y,d]=q.shift();if(d>=u.mov)continue;
for(const [dx,dy] of D){const nx=x+dx,ny=y+dy,k=nx+','+ny;
if(nx<0||ny<0||nx>=C||ny>=R||seen[k]||Math.abs(Hh[ny][nx]-Hh[y][x])>u.jump)continue;
const o=at(nx,ny);if(o&&o.team!==u.team)continue;
seen[k]=1;q.push([nx,ny,d+1]);if(!o)out.push([nx,ny]);}}return out;}
function dmg(a,t,ax=a.x,ay=a.y){const dh=Hh[ay][ax]-Hh[t.y][t.x];let m=1+Math.max(-.3,Math.min(.3,dh*.15));
const dot=D[t.f][0]*(ax-t.x)+D[t.f][1]*(ay-t.y);m*=dot>0?1:dot<0?1.5:1.25;return Math.round(a.atk*m);}
function hit(a,t){a.f=dirTo(a,t);const dot=D[t.f][0]*(a.x-t.x)+D[t.f][1]*(a.y-t.y),d=dmg(a,t);t.hp-=d;
say(a.n+' → '+t.n+' '+d+(dot<0?' (serangan belakang!)':dot==0?' (samping)':''));if(t.hp<=0)t.hp=0;}
function role(u){return u.n==='Ksatria'?'knight':u.n==='Pemanah'?'archer':u.n==='Penyihir'?'mage':u.n==='Dukun'?'shaman':'fighter';}
function skillName(u){return ({knight:'Tebasan Berat',archer:'Hujan Panah',mage:'Bola Api',shaman:'Gelombang Rune',fighter:'Pukulan Kuat'})[role(u)];}
function skillCost(u){return role(u)==='mage'||role(u)==='shaman'?10:8;}
function skillTargets(u){const r=role(u)==='knight'||role(u)==='fighter'?1:role(u)==='archer'?5:3;return units.filter(t=>t.hp>0&&t.team!==u.team&&Math.abs(t.x-u.x)+Math.abs(t.y-u.y)<=r).map(t=>[t.x,t.y]);}
function castSkill(a,t){
 const cost=skillCost(a);if(a.mp<cost||a.skillCd>0){say('Skill belum siap — MP '+a.mp+'/'+a.mmp+', cooldown '+a.skillCd);return;}
 a.mp-=cost;a.skillCd=a.skillMax;a.f=dirTo(a,t);const type=role(a);
 const base=type==='knight'?1.8:type==='archer'?1.6:type==='mage'?1.5:type==='shaman'?1.35:1.5;
 const primary=Math.max(1,Math.round(a.atk*base));t.hp=Math.max(0,t.hp-primary);let extra=0;
 if(type==='knight'||type==='fighter'||type==='mage'||type==='shaman'){
   for(const other of units){if(other.hp<=0||other.team===a.team||other===t)continue;
     if(Math.abs(other.x-t.x)+Math.abs(other.y-t.y)===1){const splash=Math.max(1,Math.round(a.atk*(type==='knight'?0.55:type==='fighter'?0.35:type==='mage'?0.6:0.45)));other.hp=Math.max(0,other.hp-splash);extra++;}
   }
 }
 say(a.n+' memakai '+skillName(a)+'! '+t.n+' -'+primary+' HP'+(extra?' • '+extra+' musuh sekitar terkena':'')+' • MP '+a.mp);
 sel=null;phase='idle';tiles=[];if(check())return;
 if(units.filter(x=>x.team===0&&x.hp>0).every(x=>x.done))enemyTurn();else{ui();draw();}
}
function inRange(u,px=u.x,py=u.y){const o=[];for(const t of units)if(t.hp>0&&t.team!==u.team){const d=Math.abs(t.x-px)+Math.abs(t.y-py);if(d>0&&d<=u.rng)o.push([t.x,t.y]);}return o;}
function check(){const p=units.some(u=>u.team==0&&u.hp>0),e=units.some(u=>u.team==1&&u.hp>0);
if(!e||!p){over=true;say(e?'KALAH 💀':'MENANG! 🏆');ui();draw();return true;}return false;}
function finish(u){u.done=true;sel=null;phase='idle';tiles=[];if(check())return;
if(units.filter(x=>x.team==0&&x.hp>0).every(x=>x.done))enemyTurn();else{ui();draw();}}
function enemyTurn(){phase='enemy';ui();const es=units.filter(u=>u.team==1&&u.hp>0);let i=0;
function next(){if(over)return;if(i>=es.length){units.forEach(u=>{u.done=false;if(u.team===0){u.mp=Math.min(u.mmp,u.mp+4);u.skillCd=Math.max(0,u.skillCd-1);}});turn++;phase='idle';say('Giliran '+turn+' — pilih unit biru • MP pulih 4');ui();draw();return;}
const e=es[i++];if(e.hp<=0)return next();const ps=units.filter(u=>u.team==0&&u.hp>0);let best=null,bs=-1e9;
for(const [x,y] of reach(e))for(const p of ps){const d=Math.abs(p.x-x)+Math.abs(p.y-y);let s;
if(d>0&&d<=e.rng){const k=dmg(e,p,x,y);s=1000+k+(p.hp<=k?500:0);}else s=-d;if(s>bs){bs=s;best=[x,y,p,d>0&&d<=e.rng];}}
const [bx,by,p,atk]=best;if(bx!=e.x||by!=e.y){e.f=dirTo(e,{x:bx,y:by});e.x=bx;e.y=by;}
if(atk)hit(e,p);else e.f=dirTo(e,p);draw();if(check())return;setTimeout(next,700);}
setTimeout(next,500);}
function ui(){bar.innerHTML='';const b=(t,c,f)=>{const e=document.createElement('button');e.textContent=t;e.className=c;e.onclick=f;bar.appendChild(e);};
if(over)b('Main lagi','',init);
else if(phase=='act'){b('Serang','r',()=>{tiles=inRange(sel);phase='target';ui();draw();});b('Skill','',()=>{if(sel.mp<skillCost(sel)||sel.skillCd>0){say(skillName(sel)+' • MP '+sel.mp+'/'+sel.mmp+' • cooldown '+sel.skillCd);return;}tiles=skillTargets(sel);phase='skillTarget';say(skillName(sel)+' — pilih musuh • biaya '+skillCost(sel)+' MP');ui();draw();});b('Tunggu','',()=>finish(sel));b('Batal','g',cancel);}
else if(phase=='target'||phase=='skillTarget')b('Batal','g',()=>{phase='act';tiles=[];ui();draw();});
else if(phase=='idle')b('Akhiri giliran','g',()=>{units.forEach(u=>{if(u.team==0)u.done=true});enemyTurn();});}
function cancel(){if(sel){sel.x=sel.px;sel.y=sel.py;sel.f=sel.pf;}sel=null;phase='idle';tiles=[];ui();draw();}
cv.addEventListener('pointerdown',e=>{if(over||phase=='enemy')return;const r=cv.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/T),y=Math.floor((e.clientY-r.top)/T);
if(x<0||y<0||x>=C||y>=R)return;const u=at(x,y),has=tiles.some(t=>t[0]==x&&t[1]==y);
if(phase=='target'){if(has&&u&&u.team==1){hit(sel,u);finish(sel);}return;}
if(phase=='skillTarget'){if(has&&u&&u.team==1){const actor=sel;castSkill(actor,u);}return;}
if(phase=='act')return;
if(phase=='move'&&has&&(!u||u===sel)){sel.px=sel.x;sel.py=sel.y;sel.pf=sel.f;
if(x!=sel.x||y!=sel.y){sel.f=dirTo(sel,{x,y});sel.x=x;sel.y=y;}phase='act';tiles=[];ui();draw();return;}
if(u&&u.team==0&&!u.done){sel=u;phase='move';tiles=reach(u);say(u.n+' HP '+u.hp+'/'+u.mhp+' ATK '+u.atk+' Gerak '+u.mov+' Jangkauan '+u.rng+' • MP '+u.mp+'/'+u.mmp+' • '+skillName(u)+' CD '+u.skillCd);}
else if(u)say(u.n+' HP '+u.hp+'/'+u.mhp+' ATK '+u.atk);
else{sel=null;phase='idle';tiles=[];}
ui();draw();});
function draw(){g.clearRect(0,0,cv.width,cv.height);
for(let y=0;y<R;y++)for(let x=0;x<C;x++){g.fillStyle=`hsl(235,25%,${16+Hh[y][x]*9+((x+y)%2)*2}%)`;g.fillRect(x*T,y*T,T,T);
g.fillStyle='#fff6';g.font=T*.22+'px sans-serif';g.fillText(Hh[y][x],x*T+3,y*T+T*.24);}
const mv=phase=='move';for(const [x,y] of tiles){g.fillStyle=mv?'#50a0ff77':'#ff465a77';g.fillRect(x*T+1,y*T+1,T-2,T-2);}
for(const u of units){if(u.hp<=0)continue;const bob=Math.sin(Date.now()/230+u.x*1.4+u.y)*T*.025,cx=u.x*T+T/2,cy=u.y*T+T/2+bob;g.globalAlpha=u.done?.45:1;
 drawSprite(u,cx,cy,T,Date.now());
 if(u===sel){g.strokeStyle='#ffd84a';g.lineWidth=2;g.strokeRect(u.x*T+2,u.y*T+2,T-4,T-4);}
 g.fillStyle='#111';g.fillRect(u.x*T+3,u.y*T+T-8,T-6,5);g.fillStyle='#56e66a';g.fillRect(u.x*T+3,u.y*T+T-8,(T-6)*u.hp/u.mhp,5);
 g.fillStyle='#55c9ff';g.fillRect(u.x*T+3,u.y*T+T-3,(T-6)*u.mp/u.mmp,2);g.globalAlpha=1;}}
function drawSprite(u,cx,cy,t,now){
 const px=Math.max(2,Math.floor(t/12)),p=(x,y,w,h,color)=>{g.fillStyle=color;g.fillRect(Math.round(cx+x*px),Math.round(cy+y*px),w*px,h*px);};
 const team=u.team?'#d94b58':'#3987ed',dark=u.team?'#782c46':'#203b82',skin='#f4c59c',hair=role(u)==='mage'?'#ded7f5':role(u)==='archer'?'#d4a25c':'#49344b';
 const walk=Math.sin(now/95+u.x)*1.2;
 p(-3,4,6,1,'#0007');p(-2,2,2,2,dark);p(1,2,2,2,dark);
 p(-2,-2,5,4,team);p(-1,-5,3,3,skin);p(-2,-6,5,2,hair);
 p(-3,-3,1,3,skin);p(3,-3,1,3,skin);
 p(-2,4+walk,2,1,'#d7d7e8');p(1,4-walk,2,1,'#d7d7e8');
 if(role(u)==='mage'||role(u)==='shaman'){p(2,-7,2,3,'#8b68db');p(3,-8,1,1,'#ffd76a');}
 else if(role(u)==='archer'){p(3,-2,1,5,'#b58b54');p(4,-2,1,3,'#ffe2a0');}
 else{p(3,-2,1,4,'#c7d2e2');p(3,-3,2,1,'#f3f6ff');}
 p(-1,-4,1,1,'#211d2a');p(1,-4,1,1,'#211d2a');
}
init();resize();
</script></body></html>
